# Builds the viewer app on macOS + Windows and publishes a GitHub release with one bundle per
# platform (install guide + mod installer + viewer installer; see release/package.sh).
#
# Release: bump the version in app/src-tauri/tauri.conf.json (+ Cargo.toml, package.json),
# refresh mod/dist with mod/build-dist.sh if the mod changed, then:
#   git tag v0.3.0 && git push origin v0.3.0
# The release is created as a draft; check it on GitHub and publish.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            build-args: --target universal-apple-darwin --bundles dmg
            artifact: app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - platform: windows
            os: windows-latest
            rust-targets: ""
            build-args: --bundles nsis
            artifact: app/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install app build tools
        working-directory: app
        run: npm ci

      - name: Build the viewer app
        working-directory: app
        run: npx tauri build ${{ matrix.build-args }}

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.platform }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package platform bundles
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash release/package.sh macos   "$(ls artifacts/app-macos/*.dmg)"   "$VERSION" out
          bash release/package.sh windows "$(ls artifacts/app-windows/*.exe)" "$VERSION" out
          ls -la out

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/*.zip \
            --draft \
            --title "TaleSpire Map Tools $GITHUB_REF_NAME" \
            --notes-file release/notes.md
