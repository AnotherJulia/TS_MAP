[package]
name = "talespire-map-viewer"
version = "0.4.0"
description = "Desktop viewer for TaleSpire Map Exporter board exports"
edition = "2021"

[lib]
name = "talespire_map_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
# Mod installer: download + verify + unpack BepInEx.
ureq = "2"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
